sonar.projectKey=thirtytwobits_react-mnemonic
sonar.organization=thirtytwobits-github
sonar.projectName=react-mnemonic

# Keep the initial analysis focused on the published library so coverage
# reflects the package users actually consume.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,dist/**,coverage/**,docs/**,website/**,devtools-extension/**,node_modules/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
