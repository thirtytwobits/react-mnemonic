sonar.projectKey=thirtytwobits_react-mnemonic
sonar.organization=thirtytwobits-github
sonar.projectName=react-mnemonic

# Keep the analysis focused on the published library implementation.
# Tests are excluded from Sonar analysis entirely.
sonar.sources=src
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,dist/**,coverage/**,docs/**,website/**,devtools-extension/**,node_modules/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
